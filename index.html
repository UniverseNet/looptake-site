<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f1e8">
  <meta name="description" content="LoopTake는 연습을 기록하고 지난 테이크와 비교할 수 있도록 준비 중인 VERA Studio의 앱입니다.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; media-src 'none'; base-uri 'none'; form-action 'none'">
  <title>LoopTake · 오늘의 연습을 다음 테이크로</title>
  <link rel="icon" type="image/png" href="./assets/mark.png">
  <link rel="stylesheet" href="./styles.css?v=flow">
  <script src="./studio.js?v=flow" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <div class="header-inner wrap">
      <a class="brand" href="#top" aria-label="LoopTake 홈" aria-current="page">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>LoopTake</span>
      </a>
      <nav aria-label="주 메뉴">
        <a href="./features.html">기능 소개</a>
        <a href="#launch">출시 안내</a>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="hero wrap" aria-labelledby="hero-title" id="rehearsal">
      <div class="hero-copy">
        <p class="release-status">정식 출시 준비 중</p>
        <h1 id="hero-title">연습 영상을<br><span>한 테이크씩.</span></h1>
        <p class="intro">춤 한 동작, 기타 두 마디. 찍어 둔 연습을 다시 보고 다음 테이크와 비교하는 앱을 만들고 있어요.</p>
        <div class="hero-links">
          <a class="primary" href="./features.html">기능 살펴보기 <span aria-hidden="true">→</span></a>
          <a class="text-link" href="./features.html#community">함께 연습하기</a>
        </div>
      </div>

      <figure class="hero-scene" data-scene="dance">
        <div class="hero-art">
          <div class="photo-window">
            <img class="scene-photo" src="./assets/dance.webp" srcset="./assets/dance-small.webp 530w, ./assets/dance.webp 1060w" sizes="(max-width: 760px) calc(100vw - 36px), (max-width: 1360px) 50vw, 630px" width="1060" height="1325" loading="eager" fetchpriority="high" alt="파란 조명의 연습실에서 휴대폰을 삼각대에 세우고 춤을 연습하는 사람">
          </div>
          <div class="demo-device hero-device" role="img" aria-label="촬영한 춤 연습을 LoopTake에서 확인하는 제품 데모">
            <div aria-hidden="true">
              <div class="device-head"><strong>LoopTake</strong><span></span></div>
              <img src="./assets/dance-small.webp" srcset="./assets/dance-small.webp 530w, ./assets/dance.webp 1060w" sizes="150px" width="530" height="663" loading="lazy" decoding="async" alt="">
              <div class="device-copy"><strong>오늘의 춤 연습</strong><span>촬영 후 확인</span></div>
            </div>
          </div>
        </div>
        <figcaption><strong>혼자 몰입하는 연습</strong><span>AI 생성 연출 이미지 · 제품 데모</span></figcaption>
      </figure>
    </section>

    <section class="stories" id="about" aria-labelledby="stories-title" tabindex="-1">
      <div class="wrap">
        <div class="section-intro" data-reveal>
          <h2 id="stories-title">다시 보고 싶은<br>순간들.</h2>
          <p>혼자 다시 보고 싶은 동작도, 친구들과 함께 웃고 싶은 장면도. LoopTake가 그리는 연습의 모습이에요.</p>
        </div>
        <div class="story-spread">
          <figure class="story-friends" data-scene="friends" data-reveal>
            <div class="photo-window">
              <img class="scene-photo" src="./assets/friends.webp" srcset="./assets/friends-small.webp 530w, ./assets/friends.webp 1060w" sizes="(max-width: 760px) calc(100vw - 36px), (max-width: 1360px) 42vw, 536px" width="1060" height="1325" loading="lazy" decoding="async" alt="친구 세 명이 한 휴대폰 화면을 들여다보며 웃는 모습">
            </div>
            <figcaption>
              <div><h3>같이 보면 더 재밌는 순간</h3><p>서로 찍은 장면을 돌려 보는 저녁.</p></div>
              <span>AI 생성 연출 이미지</span>
            </figcaption>
          </figure>
          <figure class="story-guitar" data-scene="guitar" data-reveal>
            <div class="guitar-art">
              <div class="photo-window">
                <img class="scene-photo" src="./assets/guitar.webp" srcset="./assets/guitar-small.webp 530w, ./assets/guitar.webp 1060w" sizes="(max-width: 760px) calc(100vw - 36px), (max-width: 1360px) 46vw, 595px" width="1060" height="1325" loading="lazy" decoding="async" alt="노을빛이 비치는 거리에서 통기타를 연주하는 사람">
              </div>
              <div class="demo-device guitar-device" role="img" aria-label="거리의 기타 연주 사진을 LoopTake 감상 화면에 담은 제품 데모">
                <div aria-hidden="true">
                  <div class="device-head"><strong>LoopTake</strong><span></span></div>
                  <img src="./assets/guitar-small.webp" srcset="./assets/guitar-small.webp 530w, ./assets/guitar.webp 1060w" sizes="160px" width="530" height="663" loading="lazy" decoding="async" alt="">
                  <div class="device-copy"><strong>거리의 기타 연주</strong><span>감상 화면 예시</span></div>
                </div>
              </div>
            </div>
            <figcaption>
              <div><h3>길에서 건진 한 소절</h3><p>다시 듣고 싶은 연주를 한 테이크로.</p></div>
              <span>AI 생성 연출 이미지 · 제품 데모</span>
            </figcaption>
          </figure>
        </div>
      </div>
    </section>

    <section id="launch" class="launch" aria-labelledby="launch-title" tabindex="-1">
      <div class="wrap launch-inner" data-reveal>
        <div>
          <h2 id="launch-title">정식 출시 준비 중</h2>
          <p>연습을 남기고 돌아보는 흐름을 다듬고 있어요.</p>
        </div>
        <a class="back-to-top" href="#top" aria-label="맨 위로">↑</a>
      </div>
    </section>
  </main>

  <footer class="site-footer wrap">
    <p><strong>LoopTake</strong> <span>by VERA Studio</span></p>
  </footer>
</body>
</html>
